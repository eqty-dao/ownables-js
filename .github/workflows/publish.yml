name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Unit Tests']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.2.2
          npm --version

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Restore Yarn cache
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Guard the pre-1.0 release line
        run: yarn release:preflight

      - name: Release
        run: yarn semantic-release --repository-url "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recover-0-14-1:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.14.1
          fetch-depth: 0

      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = 'fe8ecfc5df5afdf590a9b374ddcd4cc0c5d90025'
          test "$(git rev-parse refs/tags/v0.14.1)" = "$(git rev-parse HEAD)"
          test "$(node -p 'require("./packages/core/package.json").version')" = '0.14.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.2

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and inspect the exact release archives
        run: |
          node bin/release-artifacts.mjs 0.14.1 --verify-twice
          node bin/verify-release-packages.mjs 0.14.1

      - name: Publish and verify through npm OIDC
        run: |
          for attempt in $(seq 1 32); do
            if node bin/publish-release.mjs 0.14.1; then
              exit 0
            fi
            if [ "$attempt" -eq 32 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Create GitHub Release after registry verification
        run: |
          if gh release view v0.14.1 --json tagName >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/ownables-existing-release"
            gh release download v0.14.1 --pattern manifest.json --dir "$RUNNER_TEMP/ownables-existing-release"
            cmp release-artifacts/0.14.1/manifest.json "$RUNNER_TEMP/ownables-existing-release/manifest.json"
          else
            gh release create v0.14.1 release-artifacts/0.14.1/manifest.json --verify-tag --generate-notes --title v0.14.1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
