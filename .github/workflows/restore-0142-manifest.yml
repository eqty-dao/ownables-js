name: Restore v0.14.2 release manifest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ownables-js-restore-0142-manifest
  cancel-in-progress: false
  queue: max

jobs:
  restore-manifest:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.14.2
          fetch-depth: 0

      - name: Verify immutable release source
        run: |
          test "$(git rev-parse HEAD)" = 'aa85d8a24d5e357eff0c5c0c9c131d3c4b144295'
          test "$(git rev-parse 'refs/tags/v0.14.2^{commit}')" = "$(git rev-parse HEAD)"
          test "$(node -p 'require("./packages/core/package.json").version')" = '0.14.2'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the release npm version
        run: npm install --global npm@12.2.2

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Rebuild and inspect the release archives
        run: |
          node bin/release-artifacts.mjs 0.14.2 --verify-twice
          node bin/verify-release-packages.mjs 0.14.2

      - name: Compare every archive with npm
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { publicPackageNames } from './bin/release-artifacts.mjs';

          const version = '0.14.2';
          const manifest = JSON.parse(readFileSync(`release-artifacts/${version}/manifest.json`, 'utf8'));
          const expectedNames = new Set(publicPackageNames.map((name) => `@ownables/${name}`));
          if (
            manifest.schemaVersion !== 1 ||
            manifest.sourceCommit !== 'aa85d8a24d5e357eff0c5c0c9c131d3c4b144295' ||
            manifest.version !== version ||
            manifest.packages?.length !== expectedNames.size
          ) {
            throw new Error('Unexpected v0.14.2 release manifest.');
          }

          async function registryJson(url) {
            const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`npm registry returned ${response.status} for ${url}`);
            return response.json();
          }

          for (const item of manifest.packages) {
            if (!expectedNames.delete(item.name) || item.version !== version) {
              throw new Error(`Unexpected release package ${item.name}@${item.version}.`);
            }
            const baseUrl = `https://registry.npmjs.org/${encodeURIComponent(item.name)}`;
            const packageMetadata = await registryJson(baseUrl);
            const versionMetadata = await registryJson(`${baseUrl}/${version}`);
            if (packageMetadata['dist-tags']?.latest !== version) {
              throw new Error(`${item.name} latest is not ${version}.`);
            }
            if (
              versionMetadata.name !== item.name ||
              versionMetadata.version !== version ||
              versionMetadata.dist?.integrity !== item.integrity ||
              typeof versionMetadata.dist?.tarball !== 'string'
            ) {
              throw new Error(`${item.name}@${version} metadata differs from the manifest.`);
            }
            const archive = await fetch(versionMetadata.dist.tarball, {
              signal: AbortSignal.timeout(60_000),
            });
            if (!archive.ok) {
              throw new Error(`${item.name}@${version} archive returned ${archive.status}.`);
            }
            const integrity = `sha512-${createHash('sha512').update(Buffer.from(await archive.arrayBuffer())).digest('base64')}`;
            if (integrity !== item.integrity) {
              throw new Error(`${item.name}@${version} archive differs from the manifest.`);
            }
            console.log(`Verified ${item.name}@${version}.`);
          }
          if (expectedNames.size > 0) {
            throw new Error(`Missing release packages: ${[...expectedNames].join(', ')}`);
          }
          NODE

      - name: Require release without a manifest asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="$(gh release view v0.14.2 --json tagName,assets)"
          test "$(jq -r '.tagName' <<< "$release")" = 'v0.14.2'
          test "$(jq '[.assets[] | select(.name == "manifest.json")] | length' <<< "$release")" = '0'

      - name: Upload only the verified manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v0.14.2 release-artifacts/0.14.2/manifest.json
