name: Release

on:
  workflow_run:
    workflows: ['Unit Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_missing:
        description: 'Publish missing packages for the current release commit'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_missing == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Restore Yarn cache
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Release
        if: ${{ github.event_name == 'workflow_run' }}
        run: yarn semantic-release --repository-url "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish missing packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_missing == true }}
        run: |
          yarn build:packages
          for directory in packages/*; do
            if [ ! -f "$directory/package.json" ]; then
              continue
            fi
            package_name="$(node -p "const packageJson=require('./$directory/package.json'); packageJson.private ? '' : packageJson.name")"
            package_version="$(node -p "require('./$directory/package.json').version")"
            if [ -z "$package_name" ] || [ "$package_version" != "2.0.0" ]; then
              continue
            fi
            encoded_name="${package_name//@/%2F}"
            if curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "https://registry.npmjs.org/${encoded_name}/2.0.0" >/dev/null; then
              echo "Skipping already published ${package_name}@2.0.0"
              continue
            fi
            echo "Publishing ${package_name}@2.0.0"
            (cd "$directory" && yarn npm publish --access public --provenance)
          done
