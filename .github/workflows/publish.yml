name: Release

on:
  workflow_run:
    workflows: ['Unit Tests']
    types: [completed]
    branches: [main]

concurrency:
  group: ownables-js-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require the tested source to be current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.2.2
          npm --version

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Restore Yarn cache
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Guard the pre-1.0 release line
        run: yarn release:preflight

      - name: Release
        run: yarn semantic-release --repository-url "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
